<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quem vai ganhar? ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --jade:#2fb68a; --jade-d:#0f6b52; --mint:#d9f7ea; --pink:#ff8fb7; --pink-d:#d6336c;
  --blue:#7fb8f5; --blue-d:#2b6fd1; --ink:#2b3a36;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Fredoka","Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#e3fbf0 0%,#fff0f6 55%,#e6f2ff 100%);
  overflow-x:hidden;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
/* bolhas de fundo */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;bottom:-60px;opacity:.5;animation:rise linear infinite;will-change:transform}
@keyframes rise{
  0%{transform:translateY(0) rotate(0) translateX(0)}
  50%{transform:translateY(-60vh) rotate(20deg) translateX(18px)}
  100%{transform:translateY(-115vh) rotate(-15deg) translateX(-12px)}
}
main{
  position:relative;z-index:1;min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px 32px;text-align:center;gap:14px;
}
.baby{font-size:44px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
h1{font-size:clamp(30px,8vw,48px);font-weight:700;color:var(--jade-d);line-height:1.1}
.sub{min-height:28px;font-size:clamp(16px,4.2vw,20px);font-weight:500;color:#5a6f69;transition:opacity .3s}
.turns{display:flex;gap:14px}
.chip{
  width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  font-size:32px;font-weight:700;background:#fff;opacity:.45;
  transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .3s,box-shadow .3s;
}
.chip.f{color:var(--pink-d)} .chip.m{color:var(--blue-d)}
.chip.on{opacity:1;transform:scale(1.18) translateY(-3px);box-shadow:0 8px 20px rgba(47,182,138,.35)}
.wrap{position:relative;width:min(92vw,400px)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,14px)}
.card{
  aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;
  perspective:700px;border-radius:24px;font:inherit;
}
.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.3,.5,1)}
.card.open .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:24px;display:grid;place-items:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 6px 0 rgba(15,107,82,.18),0 12px 22px rgba(15,107,82,.14);
}
.back{background:linear-gradient(145deg,#a6efd2,#35b98c)}
.back::after{
  content:"";position:absolute;inset:0;border-radius:24px;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);
  background-size:250% 100%;animation:sheen 3.6s ease-in-out infinite;
}
@keyframes sheen{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.back svg{width:58%;height:58%;filter:drop-shadow(0 3px 3px rgba(15,107,82,.35))}
.front{transform:rotateY(180deg)}
.f .front{background:linear-gradient(145deg,#ffe0eb,#ff9cbd)}
.m .front{background:linear-gradient(145deg,#d8ebff,#8fc3fb)}
.sym{font-size:clamp(46px,16vw,78px);font-weight:700;line-height:1;text-shadow:0 3px 0 rgba(255,255,255,.7)}
.f .sym{color:var(--pink-d)} .m .sym{color:var(--blue-d)}
.open .sym{animation:pop .6s .35s both cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.card.next{animation:glow 1.3s ease-in-out infinite}
.card.next .back{outline:4px solid #fff;outline-offset:-4px}
@keyframes glow{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,143,183,0))}
  50%{transform:scale(1.07) rotate(-1.5deg);filter:drop-shadow(0 0 14px rgba(255,143,183,.95))}
}
.card.nope{animation:nope .45s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.card.winner .inner{animation:winpulse .8s ease-in-out infinite alternate}
@keyframes winpulse{from{transform:rotateY(180deg) scale(1)}to{transform:rotateY(180deg) scale(1.1)}}
.card:disabled{cursor:default}
.card.dim{opacity:.55}
.line{position:absolute;inset:0;pointer-events:none;overflow:visible}
.line line{stroke:#ffd34e;stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,211,78,.9))}
.hint{font-size:15px;color:#7a8d87}
#snd{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0));right:12px;z-index:5;
  width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:20px;cursor:pointer;
  box-shadow:0 4px 12px rgba(15,107,82,.18)
}
/* final */
.win{
  position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:20px;text-align:center;overflow:auto;
  background:radial-gradient(circle at 50% 32%,#f2fff9 0%,#bdf1da 45%,#ffd3e4 100%);
  opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s;
}
.win.show{opacity:1;visibility:visible}
.gemwrap{--r:min(34vw,150px);position:relative;width:min(46vw,210px);aspect-ratio:1;margin:6px auto 4px;transform:scale(0) rotate(-200deg)}
.win.show .gemwrap{animation:gemin 1.4s .2s cubic-bezier(.2,1.4,.4,1) forwards,floaty 3.2s 1.6s ease-in-out infinite}
@keyframes gemin{to{transform:scale(1) rotate(0)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.gemwrap>svg{width:100%;height:100%;filter:drop-shadow(0 12px 18px rgba(15,107,82,.45))}
.halo{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 65%);animation:halo 2.4s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.1);opacity:1}}
.shine{animation:shine 2.6s 1.4s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-140px)}60%,100%{transform:translateX(260px)}}
.orbit{position:absolute;inset:0;animation:spin 14s linear infinite}
.orbit span{
  position:absolute;left:50%;top:50%;font-size:26px;
  transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-1*var(--r))) rotate(calc(-1*var(--a)));
}
@keyframes spin{to{transform:rotate(360deg)}}
.win p,.win h2,.win .name,.win button{opacity:0;transform:translateY(24px)}
.win.show p,.win.show h2,.win.show .name,.win.show button{animation:up .8s cubic-bezier(.2,1.3,.4,1) forwards}
.win.show .c1{animation-delay:1.1s}.win.show h2{animation-delay:1.5s}
.win.show .name{animation-delay:1.9s}.win.show .note{animation-delay:2.6s}.win.show button{animation-delay:3.2s}
@keyframes up{to{opacity:1;transform:translateY(0)}}
.c1{font-size:clamp(26px,7vw,40px);font-weight:600;color:var(--jade-d)}
.win h2{font-size:clamp(34px,9.5vw,62px);font-weight:700;color:var(--pink-d);line-height:1.05;text-shadow:0 3px 0 #fff}
.name{display:flex;justify-content:center;line-height:1;margin:2px 0}
.name i{
  font-style:normal;font-weight:700;font-size:clamp(72px,24vw,140px);display:inline-block;
  background:linear-gradient(100deg,#0c7a5a,#5fe0b0,#e9fff6,#5fe0b0,#0c7a5a);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(255,255,255,.8));
  animation:letter 1.6s ease-in-out infinite,shimmer 3s linear infinite;animation-delay:calc(var(--n)*.12s)
}
@keyframes letter{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-3deg)}}
@keyframes shimmer{to{background-position:-300% 0}}
.note{font-size:clamp(16px,4.4vw,22px);font-weight:500;color:#4c6a61;max-width:420px}
.win button{
  margin-top:10px;font:inherit;font-size:17px;font-weight:600;color:#fff;border:0;border-radius:999px;
  padding:12px 26px;background:linear-gradient(135deg,var(--jade),#1c8f6b);cursor:pointer;
  box-shadow:0 6px 0 #146b50,0 10px 20px rgba(15,107,82,.3)
}
.win button:active{transform:translateY(4px);box-shadow:0 2px 0 #146b50}
#fx{position:fixed;inset:0;z-index:20;pointer-events:none}
:focus-visible{outline:3px solid var(--pink-d);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gem" viewBox="0 0 200 200">
    <polygon points="70,35 130,35 115,70 85,70" fill="#c9fbe6"/>
    <polygon points="70,35 85,70 40,70" fill="#7be3b8"/>
    <polygon points="130,35 160,70 115,70" fill="#4fd0a0"/>
    <polygon points="40,70 85,70 100,170" fill="#2fb68a"/>
    <polygon points="85,70 115,70 100,170" fill="#5fe0b0"/>
    <polygon points="115,70 160,70 100,170" fill="#13946c"/>
  </symbol>
</svg>
<div class="bg" id="bg" aria-hidden="true"></div>
<button id="snd" aria-label="Ligar ou desligar o som">🔔</button>

<main>
  <div class="baby" aria-hidden="true">🍼</div>
  <h1>Quem vai ganhar?</h1>
  <p class="sub" id="status">Toque na carta que está brilhando!</p>
  <div class="turns" aria-hidden="true">
    <div class="chip f" id="tf">♀︎</div><div class="chip m" id="tm">♂︎</div>
  </div>
  <div class="wrap" id="wrap">
    <div class="board" id="board"></div>
    <svg class="line" id="line"></svg>
  </div>
  <p class="hint">Jogo da velha da grande revelação</p>
</main>

<section class="win" id="win" aria-live="polite">
  <div class="gemwrap">
    <div class="halo"></div>
    <div class="orbit">
      <span style="--a:0deg">💖</span><span style="--a:60deg">♀︎</span><span style="--a:120deg">✨</span>
      <span style="--a:180deg">💚</span><span style="--a:240deg">♀︎</span><span style="--a:300deg">🎀</span>
    </div>
    <svg viewBox="0 0 200 200">
      <defs><clipPath id="gc"><polygon points="40,70 70,35 130,35 160,70 100,170"/></clipPath></defs>
      <use href="#gem"/>
      <g clip-path="url(#gc)"><polygon class="shine" points="0,0 28,0 -6,200 -34,200" fill="#fff" opacity=".6"/></g>
    </svg>
  </div>
  <p class="c1">Parabéns! 🎉</p>
  <h2>É uma menina!</h2>
  <div class="name" id="name" aria-label="Jade"></div>
  <p class="note">Preciosa e brilhante como uma pedra de jade. Seja muito bem-vinda, pequena! 💚</p>
  <button id="again">Jogar de novo</button>
</section>
<canvas id="fx"></canvas>

<script>

const F='\u2640\uFE0E', M='\u2642\uFE0E';
// Jogo roteirizado: o ♀ sempre vence (diagonal 2-4-6), com suspense no meio
const seq=[[4,'f'],[1,'m'],[0,'f'],[8,'m'],[6,'f'],[3,'m'],[2,'f']];
const WIN=[2,4,6];
const msgs=[
  'O ♀ começou no meio!','O ♂ entrou no jogo!','Hmm, o ♀ está armando algo…',
  'O ♂ bloqueou! Será?','Dois caminhos abertos para o ♀! 👀','O ♂ só consegue bloquear um…'
];
const $=id=>document.getElementById(id);
const board=$('board'), status=$('status'), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let step=0, busy=false;

/* cartas */
function build(){
  board.innerHTML='';
  for(let i=0;i<9;i++){
    const b=document.createElement('button');
    b.className='card'; b.dataset.i=i; b.setAttribute('aria-label','Carta '+(i+1));
    b.innerHTML='<span class="inner"><span class="face back"><svg viewBox="0 0 200 200"><use href="#gem"/></svg></span><span class="face front"><span class="sym"></span></span></span>';
    board.appendChild(b);
  }
}
const cell=i=>board.children[i];
function mark(){
  [...board.children].forEach(c=>c.classList.remove('next'));
  $('tf').classList.remove('on'); $('tm').classList.remove('on');
  if(step<seq.length){
    const [i,w]=seq[step];
    cell(i).classList.add('next');
    $(w==='f'?'tf':'tm').classList.add('on');
  }
}
board.addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c||busy||step>=seq.length||c.disabled) return;
  const [i,who]=seq[step];
  if(+c.dataset.i!==i){c.classList.remove('nope');void c.offsetWidth;c.classList.add('nope');return}
  busy=true; c.disabled=true;
  c.classList.add('open',who); c.classList.remove('next');
  c.querySelector('.sym').textContent=who==='f'?F:M;
  pop(); step++;
  if(step===seq.length){ finish(); return }
  status.textContent=msgs[step-1]; mark();
  setTimeout(()=>busy=false,650);
});

/* final */
function finish(){
  $('tf').classList.remove('on'); $('tm').classList.remove('on');
  status.textContent='Três ♀ em linha!!! 🎉';
  setTimeout(()=>{
    drawLine();
    WIN.forEach(i=>cell(i).classList.add('winner'));
    [...board.children].forEach(c=>{if(!c.classList.contains('open'))c.classList.add('dim')});
    burst(innerWidth/2,innerHeight*.45,40);
  },900);
  setTimeout(showWin,2800);
}
function drawLine(){
  const w=$('wrap').getBoundingClientRect(), svg=$('line');
  svg.setAttribute('viewBox',`0 0 ${w.width} ${w.height}`);
  const pt=i=>{const r=cell(i).getBoundingClientRect();return [r.left-w.left+r.width/2,r.top-w.top+r.height/2]};
  let [x1,y1]=pt(WIN[0]),[x2,y2]=pt(WIN[2]);
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ex=dx/len*26,ey=dy/len*26;
  x1-=ex;y1-=ey;x2+=ex;y2+=ey;
  const L=Math.hypot(x2-x1,y2-y1);
  svg.innerHTML=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-dasharray="${L}" stroke-dashoffset="${L}"><animate attributeName="stroke-dashoffset" from="${L}" to="0" dur=".8s" fill="freeze"/></line>`;
}
function showWin(){
  $('win').classList.add('show');
  chime(); rain=!reduce; burst(innerWidth/2,innerHeight*.4,reduce?30:140);
  setTimeout(()=>burst(0,innerHeight*.7,50,-1),900);
  setTimeout(()=>burst(innerWidth,innerHeight*.7,50,1),900);
}
$('name').innerHTML=[...'Jade'].map((l,n)=>`<i style="--n:${n}">${l}</i>`).join('');
$('again').onclick=()=>{
  $('win').classList.remove('show'); rain=false; P=[];
  $('line').innerHTML=''; step=0; busy=false; build();
  status.textContent='Toque na carta que está brilhando!'; mark();
};

/* confete */
const cv=$('fx'),ctx=cv.getContext('2d');let P=[],rain=false,running=false,W,H;
function fit(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
fit();addEventListener('resize',fit);
const cols=['#2fb68a','#7fe0bf','#0f8a67','#ff8fb7','#ffc2d6','#ffd34e','#ffffff'];
const rnd=(a,b)=>a+Math.random()*(b-a);
function add(x,y,vx,vy){
  P.push({x,y,vx,vy,r:rnd(0,6),vr:rnd(-.2,.2),s:rnd(9,18),c:cols[Math.random()*cols.length|0],k:'rcfhd'[Math.random()*5|0],h:Math.random()<.5?'💚':'💖'});
}
function burst(x,y,n,side=0){
  for(let i=0;i<n;i++){
    const a=side?(-Math.PI/2+side*rnd(-.2,-1)):rnd(-Math.PI,0),sp=rnd(7,17);
    add(x,y,Math.cos(a)*sp,Math.sin(a)*sp);
  }
  if(!running){running=true;requestAnimationFrame(tick)}
}
function tick(){
  ctx.clearRect(0,0,W,H);
  if(rain&&Math.random()<.5)add(rnd(0,W),-20,rnd(-1,1),rnd(2,4));
  P=P.filter(p=>p.y<H+40);
  for(const p of P){
    p.vy+=.22;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    if(p.k==='r')ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    else if(p.k==='c'){ctx.beginPath();ctx.arc(0,0,p.s/3,0,7);ctx.fill()}
    else if(p.k==='d'){ctx.beginPath();ctx.moveTo(0,-p.s/2);ctx.lineTo(p.s/2.4,0);ctx.lineTo(0,p.s/2);ctx.lineTo(-p.s/2.4,0);ctx.closePath();ctx.fill()}
    else{ctx.font=`${p.s+6}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      if(p.k==='f'){ctx.fillStyle='#ff6fa3';ctx.fillText(F,0,0)}else ctx.fillText(p.h,0,0)}
    ctx.restore();
  }
  if(P.length||rain)requestAnimationFrame(tick);else{running=false;ctx.clearRect(0,0,W,H)}
}

/* som */
let ac,on=true;
function tone(f,t,d,type='sine',v=.07){
  if(!on)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.05);
  }catch(e){}
}
const pop=()=>{tone(520,0,.14,'triangle');tone(780,.06,.14,'triangle')};
const chime=()=>[784,988,1175,1568,1976,2349].forEach((f,i)=>tone(f,i*.11,.7,'sine',.06));
$('snd').onclick=e=>{on=!on;e.currentTarget.textContent=on?'🔔':'🔕'};


/* bolhas de fundo */
const sy=['♀︎','♂︎','💚','✨','🫧','🎀','♀︎','💖'];
$('bg').innerHTML=Array.from({length:16},(_,i)=>
  `<span style="left:${rnd(2,96)}%;font-size:${rnd(18,40)}px;animation-duration:${rnd(14,26)}s;animation-delay:${-rnd(0,26)}s;color:${i%3===1?'#8fc3fb':'#ff8fb7'}">${sy[i%sy.length]}</span>`).join('');

build();mark();
</script>
</body>
</html>
